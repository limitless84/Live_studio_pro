name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Base Project
        run: |
          flutter create --org com.livestudio live_studio_pro
          cd live_studio_pro
          flutter pub add provider camera flutter_webrtc web_socket_channel http permission_handler

      - name: Build Android APK
        run: |
          cd live_studio_pro
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: live_studio_pro/build/app/outputs/flutter-apk/app-debug.apk
